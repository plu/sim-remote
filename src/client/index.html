<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sim-remote</title>
  <style>
    :root { color-scheme: dark; --bg:#111; --fg:#eee; --accent:#3b82f6; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font:14px/1.4 system-ui,-apple-system,sans-serif; display:flex;
           flex-direction:column; align-items:center; gap:12px; padding:16px; }
    header { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
    #screen { background:#000; border-radius:28px; touch-action:none;
              max-height:78vh; max-width:96vw;
              box-shadow:0 8px 40px rgba(0,0,0,.6); }
    #screen.viewonly { cursor:not-allowed; }
    .btn { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px;
           padding:6px 12px; cursor:pointer; font:inherit; }
    .btn:hover { border-color:var(--accent); }
    #badge { padding:5px 12px; border-radius:999px; background:#222; white-space:nowrap; }
    #badge.driving { background:var(--accent); color:#fff; }
    #drop { position:fixed; inset:0; background:rgba(59,130,246,.18);
            border:3px dashed var(--accent); display:none; place-items:center;
            font-size:20px; font-weight:600; pointer-events:none; z-index:10; }
    #drop.over { display:grid; }
    #progress { position:fixed; top:0; left:0; height:3px; width:0;
                background:var(--accent); transition:width .2s; z-index:11; }
    #hint { color:#888; font-size:12px; }
    #toast { position:fixed; bottom:24px; background:#222; padding:10px 16px;
             border-radius:8px; opacity:0; transition:opacity .3s; pointer-events:none;
             border:1px solid #444; }
    #toast.show { opacity:1; }
  </style>
</head>
<body>
  <header>
    <select id="sims" class="btn"></select>
    <span id="badge">connecting…</span>
    <button id="take" class="btn" hidden>Take control</button>
    <button class="btn" data-button="HOME">Home</button>
    <button class="btn" data-button="LOCK">Lock</button>
    <button class="btn" data-button="SIRI">Siri</button>
    <button class="btn" id="rotate">Rotate</button>
  </header>
  <canvas id="screen"></canvas>
  <p id="hint">Drop a .zip containing an .app bundle anywhere to install it</p>
  <div id="progress"></div>
  <div id="drop">Drop to install on the simulator</div>
  <div id="toast"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
